<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgSphere" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="silhouetteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="32" fill="url(#bgSphere)"/>

  <!-- Subtle Tech Grid & Circuit Lines -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <circle cx="200" cy="200" r="160" fill="none" stroke-dasharray="6,6"/>
    <circle cx="200" cy="200" r="120" fill="none"/>
    <line x1="40" y1="200" x2="360" y2="200"/>
    <line x1="200" y1="40" x2="200" y2="360"/>
  </g>

  <!-- Glowing Outer Ring -->
  <circle cx="200" cy="180" r="115" fill="none" stroke="url(#neonCyan)" stroke-width="2.5" filter="url(#glow)" opacity="0.6"/>

  <!-- Stylized Profile Silhouette -->
  <!-- Head & Hair -->
  <circle cx="200" cy="140" r="54" fill="url(#silhouetteGrad)" stroke="#475569" stroke-width="1.5"/>
  <!-- Modern sleek hair arc -->
  <path d="M152 135 C155 100, 190 90, 225 95 C250 99, 255 125, 250 145 C242 120, 220 106, 185 110 C162 113, 155 125, 152 135 Z" fill="#475569"/>

  <!-- Shoulders & Torso -->
  <path d="M105 320 C105 240, 150 215, 200 215 C250 215, 295 240, 295 320 Z" fill="url(#silhouetteGrad)" stroke="#475569" stroke-width="1.5"/>
  
  <!-- Collar / Tech Suit Lines -->
  <path d="M175 215 L200 260 L225 215" fill="none" stroke="url(#neonCyan)" stroke-width="2" stroke-linecap="round"/>
  <path d="M200 260 L200 320" fill="none" stroke="url(#neonCyan)" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Monogram Badge -->
  <g transform="translate(160, 310)">
    <rect width="80" height="28" rx="14" fill="#0f172a" stroke="url(#neonCyan)" stroke-width="1.5"/>
    <text x="40" y="18" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.5">NAVEEN</text>
  </g>

  <!-- Orbital tech elements -->
  <circle cx="290" cy="110" r="4" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="110" cy="240" r="3" fill="#818cf8"/>
  <circle cx="310" cy="260" r="3.5" fill="#38bdf8"/>
</svg>
